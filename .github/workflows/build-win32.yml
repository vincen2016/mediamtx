name: Build Win32
"on":
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Prepare embed files
        run: |
          echo "v0.0.0-win32" > VERSION
          mkdir -p internal/servers/hls
          curl -sSL "https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js" -o internal/servers/hls/hls.min.js || touch internal/servers/hls/hls.min.js
      - name: Build Win32 binary
        run: CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -o mediamtx.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: mediamtx-win32
          path: mediamtx.exe
