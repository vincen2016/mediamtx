name: Build Win32
"on":
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -o mediamtx.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: mediamtx-win32
          path: mediamtx.exe
